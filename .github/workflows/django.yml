name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsup_ci
          POSTGRES_USER: whatsup
          POSTGRES_PASSWORD: whatsup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whatsup" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://whatsup:whatsup@localhost:5432/whatsup_ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/production.txt
      - name: Tests (SQLite, fast)
        run: python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Migrate on PostgreSQL
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: localhost

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build


