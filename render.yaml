# Render Blueprint (https://render.com) - the "easiest" free setup.
# Free web services sleep after 15 minutes without traffic (about 1 minute to
# wake up) and have no persistent disk, so use:
#   DATABASE_URL -> free Neon Postgres (https://neon.com)
#   REDIS_URL    -> free Redis Cloud database (https://redis.io/try-free)
#   media        -> S3-compatible bucket (USE_S3_MEDIA=True, see .env.example)
services:
  - type: web
    name: mhtalk-api
    runtime: docker
    plan: free
    dockerfilePath: deploy/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WHATSUP_AI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: web
    name: mhtalk-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
