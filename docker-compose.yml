services:

  web:
    build: .

    container_name: whatsup_backend

    command: >
      python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: whatsup_redis

    expose:
      - "6379"

    restart: unless-stopped
