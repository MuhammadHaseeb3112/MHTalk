openapi: 3.0.3
info:
  title: WhatsUp Backend API
  version: 1.0.0
  description: "\n        Production-ready real-time messaging and calling backend
    built with Django, Django REST Framework, Django Channels, Redis and WebRTC signaling.\n
    \       "
  contact:
    name: Muhammad Haseeb
    email: mhasseb3112@gmail.com
  license:
    name: MIT
paths:
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticate a user and return JWT tokens.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: Logout a user by blacklisting the refresh token.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/me/:
    get:
      operationId: accounts_me_retrieve
      description: Return the currently authenticated user.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/profile/update/:
    patch:
      operationId: accounts_profile_update_partial_update
      description: Update the authenticated user's profile.
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/register/:
    post:
      operationId: accounts_register_create
      description: Register a new user.
      tags:
      - accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/chat/messages/:
    post:
      operationId: chat_messages_create
      description: Send a new message to a chat room.
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessage'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessage'
          description: ''
  /api/chat/messages/{id}/:
    patch:
      operationId: chat_messages_partial_update
      description: Update a message sent by the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSendMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSendMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSendMessage'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessage'
          description: ''
  /api/chat/messages/{id}/delete/:
    delete:
      operationId: chat_messages_delete_destroy
      description: Soft delete a message.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/chat/messages/delete-for-me/:
    post:
      operationId: chat_messages_delete_for_me_create
      description: |-
        Delete a message only for
        the authenticated user.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/forward/:
    post:
      operationId: chat_messages_forward_create
      description: Forward a message to another room.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/pin/:
    post:
      operationId: chat_messages_pin_create
      description: Pin or unpin a message.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/react/:
    post:
      operationId: chat_messages_react_create
      description: |-
        Add or update a reaction
        to a message.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/star/:
    post:
      operationId: chat_messages_star_create
      description: Star or unstar a message.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/starred/:
    get:
      operationId: chat_messages_starred_retrieve
      description: |-
        Return all starred messages
        of the authenticated user.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/upload/:
    post:
      operationId: chat_messages_upload_create
      description: Upload a file and create a chat message.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/messages/voice/:
    post:
      operationId: chat_messages_voice_create
      description: Upload a voice message.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/:
    get:
      operationId: chat_rooms_list
      description: Return all chat rooms of the authenticated user.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatRoom'
          description: ''
  /api/chat/rooms/{id}/:
    get:
      operationId: chat_rooms_retrieve
      description: Return details of a single chat room.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomDetail'
          description: ''
  /api/chat/rooms/{room_id}/leave/:
    post:
      operationId: chat_rooms_leave_create
      description: Leave a group chat.
      parameters:
      - in: path
        name: room_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/{room_id}/messages/:
    get:
      operationId: chat_rooms_messages_list
      description: Return messages for a chat room.
      parameters:
      - in: path
        name: room_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
          description: ''
  /api/chat/rooms/{room_id}/messages/search/:
    get:
      operationId: chat_rooms_messages_search_retrieve
      description: Search messages inside a room.
      parameters:
      - in: path
        name: room_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/{room_id}/participants/:
    post:
      operationId: chat_rooms_participants_create
      description: Add a participant to a group.
      parameters:
      - in: path
        name: room_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/{room_id}/participants/{user_id}/:
    delete:
      operationId: chat_rooms_participants_destroy
      description: Remove a participant from a group.
      parameters:
      - in: path
        name: room_id
        schema:
          type: integer
        required: true
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/chat/rooms/archive/:
    post:
      operationId: chat_rooms_archive_create
      description: Archive or unarchive a chat.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/group/:
    post:
      operationId: chat_rooms_group_create
      description: Create a new group chat.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/mute/:
    post:
      operationId: chat_rooms_mute_create
      description: Mute or unmute a chat.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/rooms/private/:
    post:
      operationId: chat_rooms_private_create
      description: Create or return an existing private chat.
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/users/block/:
    post:
      operationId: chat_users_block_create
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/users/blocked/:
    get:
      operationId: chat_users_blocked_retrieve
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/users/unblock/:
    post:
      operationId: chat_users_unblock_create
      tags:
      - chat
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/status/:
    get:
      operationId: status_retrieve
      description: Return statuses grouped by contact.
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/status/{id}/delete/:
    delete:
      operationId: status_delete_destroy
      description: Soft delete a status.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/status/{id}/privacy/:
    post:
      operationId: status_privacy_create
      description: Update status privacy rules.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/status/{id}/view/:
    post:
      operationId: status_view_create
      description: Mark a status as viewed.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/status/{id}/viewers/:
    get:
      operationId: status_viewers_list
      description: Return viewers of my status.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusView'
          description: ''
  /api/status/me/:
    get:
      operationId: status_me_list
      description: Return my active statuses.
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Status'
          description: ''
  /api/status/upload/:
    post:
      operationId: status_upload_create
      description: Upload a new status.
      tags:
      - status
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    Attachment:
      type: object
      description: Serializer for message attachments.
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
          description: Uploaded attachment file.
        file_name:
          type: string
          readOnly: true
          description: Original filename.
        file_size:
          type: integer
          readOnly: true
          description: File size in bytes.
        mime_type:
          type: string
          readOnly: true
          description: MIME type (e.g. image/jpeg).
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - file
      - file_name
      - file_size
      - id
      - mime_type
      - uploaded_at
    ChatRoom:
      type: object
      description: Serializer for chat room list.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Group name. Leave blank for private chats.
          maxLength: 150
        room_type:
          $ref: '#/components/schemas/RoomTypeEnum'
        description:
          type: string
          description: Optional group description.
          maxLength: 255
        photo:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
        participants_count:
          type: integer
          readOnly: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
          readOnly: true
        last_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - participants
      - participants_count
      - updated_at
    ChatRoomDetail:
      type: object
      description: Serializer for chat room details.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Group name. Leave blank for private chats.
          maxLength: 150
        room_type:
          $ref: '#/components/schemas/RoomTypeEnum'
        description:
          type: string
          description: Optional group description.
          maxLength: 255
        photo:
          type: string
          format: uri
          nullable: true
        created_by:
          type: integer
          readOnly: true
        is_active:
          type: boolean
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - messages
      - participants
      - updated_at
    Message:
      type: object
      description: Serializer used when retrieving chat messages.
      properties:
        id:
          type: integer
          readOnly: true
        sender:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        content:
          type: string
          readOnly: true
        reply_to:
          type: string
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        voice_note:
          allOf:
          - $ref: '#/components/schemas/VoiceNote'
          readOnly: true
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
          readOnly: true
        is_edited:
          type: boolean
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
          description: Soft delete.
        is_starred:
          type: string
          readOnly: true
        is_pinned:
          type: boolean
        pinned_at:
          type: string
          format: date-time
          nullable: true
        forwarded_from:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachments
      - content
      - created_at
      - forwarded_from
      - id
      - is_deleted
      - is_edited
      - is_starred
      - reactions
      - reply_to
      - sender
      - updated_at
      - voice_note
    MessageTypeEnum:
      enum:
      - TEXT
      - IMAGE
      - VIDEO
      - VOICE
      - DOCUMENT
      - LOCATION
      - CONTACT
      - STICKER
      type: string
      description: |-
        * `TEXT` - Text
        * `IMAGE` - Image
        * `VIDEO` - Video
        * `VOICE` - Voice
        * `DOCUMENT` - Document
        * `LOCATION` - Location
        * `CONTACT` - Contact
        * `STICKER` - Sticker
    Participant:
      type: object
      description: Serializer for chat room participants.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        is_admin:
          type: boolean
          description: Whether this participant is a group administrator.
        is_muted:
          type: boolean
          description: Whether notifications are muted.
        muted_until:
          type: string
          format: date-time
          nullable: true
        is_archived:
          type: boolean
          description: Whether the chat is archived for this user.
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - user
    PatchedSendMessage:
      type: object
      description: Serializer used to send a new message.
      properties:
        room:
          type: integer
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        content: {}
        reply_to:
          type: integer
          nullable: true
    Profile:
      type: object
      description: Serializer for the Profile model.
      properties:
        display_name:
          type: string
          description: User's display name.
          maxLength: 100
        profile_picture:
          type: string
          format: uri
          nullable: true
        about:
          type: string
          description: User status or bio.
          maxLength: 150
        is_online:
          type: boolean
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
      required:
      - is_online
      - last_seen
    Reaction:
      type: object
      description: Serializer for message reactions.
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        sender_phone:
          type: string
          readOnly: true
        emoji:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - emoji
      - id
      - sender_phone
      - user_id
    RoomTypeEnum:
      enum:
      - PRIVATE
      - GROUP
      type: string
      description: |-
        * `PRIVATE` - Private Chat
        * `GROUP` - Group Chat
    SendMessage:
      type: object
      description: Serializer used to send a new message.
      properties:
        room:
          type: integer
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        content: {}
        reply_to:
          type: integer
          nullable: true
      required:
      - room
    Status:
      type: object
      description: Serializer for retrieving statuses.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        status_type:
          allOf:
          - $ref: '#/components/schemas/StatusTypeEnum'
          readOnly: true
        content:
          type: string
          readOnly: true
          description: Text status.
        media:
          type: string
          format: uri
          readOnly: true
          nullable: true
        background_color:
          type: string
          readOnly: true
        text_color:
          type: string
          readOnly: true
        views_count:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
        is_viewed:
          type: string
          readOnly: true
        is_expired:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - background_color
      - content
      - created_at
      - expires_at
      - id
      - is_expired
      - is_viewed
      - media
      - status_type
      - text_color
      - user
      - views_count
      - visibility
    StatusTypeEnum:
      enum:
      - TEXT
      - IMAGE
      - VIDEO
      type: string
      description: |-
        * `TEXT` - Text
        * `IMAGE` - Image
        * `VIDEO` - Video
    StatusView:
      type: object
      description: Serializer for users who viewed a status.
      properties:
        id:
          type: integer
          readOnly: true
        viewer:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        viewed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - viewed_at
      - viewer
    User:
      type: object
      description: Serializer for the User model.
      properties:
        id:
          type: integer
          readOnly: true
        phone_number:
          type: string
          description: Phone number in E.164 format (e.g. +923130067082)
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        is_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
      - date_joined
      - id
      - is_verified
      - phone_number
      - profile
    VisibilityEnum:
      enum:
      - CONTACTS
      - EVERYONE
      - CONTACTS_EXCEPT
      - ONLY_SHARE_WITH
      type: string
      description: |-
        * `CONTACTS` - My Contacts
        * `EVERYONE` - Everyone
        * `CONTACTS_EXCEPT` - My Contacts Except
        * `ONLY_SHARE_WITH` - Only Share With
    VoiceNote:
      type: object
      description: Serializer for voice notes.
      properties:
        id:
          type: integer
          readOnly: true
        audio:
          type: string
          format: uri
        duration:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Duration in seconds.
        waveform: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audio
      - created_at
      - duration
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
